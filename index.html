<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16302b"><title>A+ Gestão</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f1f4f2;--card:#fff;--ink:#14231f;--mut:#667a74;--line:#dde5e1;--side:#16302b;--acc:#0b8f68;--on:#fff;--acc2:#e6f7f1;--warn:#b7791f;--warn2:#fdf3dc;--bad:#c92a3b;--bad2:#fde8ea;--r:12px}
[data-theme=dark]{--bg:#0f1917;--card:#17252a;--ink:#e8f1ee;--mut:#8ea39d;--line:#27393d;--side:#0b1412;--acc:#20c997;--on:#06231b;--acc2:#12332c;--warn2:#3a2f14;--bad2:#3d1b20}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.main{min-width:0}.top{display:flex;align-items:center;gap:10px;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:9px;font-weight:550}.btn:hover{border-color:var(--acc)}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:700}.btn.s{padding:4px 9px;font-size:13px}
.content{padding:24px 28px;max-width:1500px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}.kpi small{color:var(--mut)}.kpi b{display:block;font-size:25px;margin-top:2px;letter-spacing:-.02em}
.row2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}.panel h3{margin:0 0 12px;font-size:16px}
.bars{display:flex;gap:12px;align-items:flex-end;height:170px}.bars div{flex:1;text-align:center;font-size:12px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--acc);border-radius:6px 6px 0 0;min-height:3px}.bars b{color:var(--ink);font-size:12px}
.al{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:var(--warn2);padding:10px 12px;border-radius:9px;margin-bottom:8px}.al.r{background:var(--bad2)}.al b{margin-left:auto}
.ok{color:var(--mut)}.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.quick button{border:1px dashed var(--line);background:none;border-radius:10px;padding:12px;text-align:left}.quick button:hover{border-color:var(--acc);background:var(--acc2)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bar input{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 11px;font-size:13px}.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:650}
.tw{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:calc(100vh - 270px)}
table{border-collapse:collapse;width:100%}th{position:sticky;top:0;background:var(--card);text-align:left;padding:10px 12px;font-size:13px;color:var(--mut);border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}tbody tr{cursor:pointer}tbody tr:hover{background:var(--acc2)}tfoot td{font-weight:700;position:sticky;bottom:0;background:var(--card)}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--line)}.pill.g{background:var(--acc2);color:var(--acc)}.pill.a{background:var(--warn2);color:var(--warn)}.pill.r{background:var(--bad2);color:var(--bad)}
.empty{text-align:center;padding:50px 20px;color:var(--mut)}.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.ov{position:fixed;inset:0;background:#0009;display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:20;overflow:auto}.ov.on{display:flex}
.modal{background:var(--card);border-radius:16px;width:min(760px,100%);box-shadow:0 20px 60px #0006}.mh,.mf{display:flex;align-items:center;gap:10px;padding:16px 20px}.mh h2{margin:0;font-size:18px;flex:1}.mf{border-top:1px solid var(--line);justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--card);border-radius:0 0 16px 16px}
.mb{padding:4px 20px 18px;max-height:68vh;overflow:auto}.fg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.f.full{grid-column:1/-1}.f label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}.f textarea{min-height:64px}
.f input[data-auto]{background:var(--acc2);border-style:dashed}.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{border:1px solid var(--line);background:var(--bg);padding:7px 12px;border-radius:9px}.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:700}
.sec{grid-column:1/-1;font-weight:650;margin-top:8px;font-size:14px}details{grid-column:1/-1}summary{cursor:pointer;color:var(--mut);margin:6px 0}details .fg{margin-top:8px}
.pal{width:min(560px,100%);margin-top:10vh}.pal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 20px;background:none;font-size:17px}.pal div.l{max-height:50vh;overflow:auto;padding:6px}.pal button{display:flex;gap:10px;width:100%;border:0;background:none;padding:9px 14px;border-radius:9px;text-align:left}.pal button.on{background:var(--acc2)}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);background:#14231f;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.2s;z-index:50;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}
.note{background:var(--warn2);padding:10px 14px;border-radius:10px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.note span{flex:1}
@media(max-width:900px){.top{flex-wrap:wrap;padding:10px 14px}.tabs{order:3;flex-basis:100%}.sub,.content{padding-left:14px;padding-right:14px}.row2{grid-template-columns:1fr}.fg{grid-template-columns:1fr}.hm{display:none}.hero{padding:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
body{--acc2:color-mix(in srgb,var(--acc) 14%,var(--card))}body[data-area=prod]{--acc:#3b5bdb}body[data-area=cresc]{--acc:#d9480f}[data-theme=dark] body[data-area=prod]{--acc:#748ffc}[data-theme=dark] body[data-area=cresc]{--acc:#ff922b}
.top{background:#10201c;color:#fff;border:0;gap:18px;padding:12px 28px}.brand{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:700}.logo{width:36px;height:36px;border-radius:10px;background:var(--acc);color:var(--on);display:grid;place-items:center;font-weight:800}
.tabs{display:flex;gap:6px;flex:1;overflow:auto}.tabs button{border:0;background:none;color:#b9cdc6;padding:9px 16px;border-radius:99px;font-weight:600;white-space:nowrap}.tabs button.on{background:var(--acc);color:var(--on)}.tabs button:hover:not(.on){background:#ffffff1c}
.top .btn{background:#ffffff14;border-color:#ffffff22;color:#fff}.top .btn.p{background:var(--acc);border-color:var(--acc);color:var(--on)}
.sub{display:flex;gap:8px;overflow:auto;padding:12px 28px;background:var(--card);border-bottom:1px solid var(--line)}.sub button{border:1px solid var(--line);background:var(--bg);padding:7px 14px;border-radius:10px;white-space:nowrap}.sub button.on{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:650}.sub small{opacity:.7;margin-left:3px}
.pt{margin:0 0 14px;font-size:24px;letter-spacing:-.02em}
.hero{background:linear-gradient(120deg,#10201c,#0f5e49 70%,#0b8f68);color:#fff;border-radius:20px;padding:30px 32px;margin-bottom:20px;display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;position:relative;overflow:hidden}
.hero:after{content:"A+";position:absolute;right:20px;top:-34px;font-size:190px;font-weight:900;color:#ffffff0d;pointer-events:none}.hero h2{margin:0;font-size:30px;letter-spacing:-.02em}.hero p{margin:4px 0 0;opacity:.8}.hero .big{font-size:40px;font-weight:800;letter-spacing:-.03em}.hero .acts{display:flex;gap:8px;flex-wrap:wrap;z-index:1}.hero .btn{background:#ffffff1f;border-color:#ffffff33;color:#fff}.hero .btn:hover{background:#fff;color:#10201c}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.ar{border-radius:18px;padding:18px;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c)}.ar h3{margin:0 0 2px;font-size:18px}.ar p{margin:0 0 12px;color:var(--mut);font-size:13px}.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.tiles button{display:flex;gap:8px;align-items:center;border:0;background:color-mix(in srgb,var(--c) 12%,var(--card));padding:10px;border-radius:12px;text-align:left}.tiles button:hover{background:color-mix(in srgb,var(--c) 26%,var(--card))}.tiles b{margin-left:auto;font-size:13px;opacity:.7}
</style></head>
<body><main class="main"><header class="top"><div class="brand"><span class="logo">A+</span>Gestão</div><nav class="tabs" id="tabs"></nav><button class="btn hm" id="pal">Buscar ou criar&nbsp; Ctrl+K</button><button class="btn" id="imp">Importar</button><button class="btn" id="theme" aria-label="Tema">◐</button><button class="btn p" id="add">+ Novo</button></header><div class="sub" id="sub"></div>
